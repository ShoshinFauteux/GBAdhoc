# moves by main plus the run's inlining changes (release +860 B, lab +1196 B;
# re-recorded with `write`).  Re-recorded: `at`/`size frame_loop` (were `main`),
# `at pace_frame`; 77 entries, 0 differ in both sections.  Needs the HW ABBA.
