# had it, 2,816 B earlier: pte_mutex_check_need_init, me_replay_lines and
# pipe_latch#1 re-recorded (pipe_latch#1 0x1960 as in that ELF;
# me_replay_lines 160 B under its 0x0f40, the function grew), nothing else.
# PCARG's site emitters log their jal for SMC_REUSE (docs/PCARG-SIDE.md
# section 9): both sections hold as recorded, nothing re-recorded.  The
# translators' +320 B (release) / +384 B (lab) comes out of
