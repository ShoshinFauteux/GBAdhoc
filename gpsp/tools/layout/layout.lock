# emitters' -128 B of cold text goes into .text.pcarg_layout_pad.
# HW-1 (claude/hw1-sleep, the sleep-path fixes on b7d0cafd): GCC re-ordered
# main's blocks (r7-L5's holds, F2), so no pad can hold the frame loop; the
# MAIN pad moves main to the shift that puts the most loop-line bytes on the
