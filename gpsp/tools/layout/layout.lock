# 64 B steps).  Re-recorded: main (at, size), exit_cb, roster_valid,
# pte_mutex_check_need_init and the lab's netpacket_iface; 37 entries, 0
# differ in both sections.
# Code-health B-4 (claude/health, the one tier-B re-pin; docs/LAYOUT-PINNING.md):
# the release no longer links usb_handoff.o, heap_trace.o or the SMC profile
# (smc_fill_* zeros keep its warm-tail rows); B-2's rfu_update shrink is given
# back (rfu_fill_update) and B-2/B-3's growth after it by memory_fill_term in
# reload_timing_info's place, so the hot core, both warm tails and B's hot
# path hold beta.5's addresses.  main is placed by the by-line scan against
# the beta.5 kit ELFs (release 0x1c64, 38.9 %; lab 0x156c, 45.3 %).
# Re-recorded: `at main`, `size main`, exit_cb, roster_valid,
