# 3.2 KB per instance are gone; nothing holds .bss there).  38 entries, 0
# differ in both sections.
# Code-health C3-3 (claude/health; docs/LAYOUT-PINNING.md "Pins"): the MAIN,
# TEXT, FE, GB and CORE pads are linker pins.  `pin NAME ADDR` is the absolute
# address the region after the pin starts at; psp/pins.ld feeds it to the link
# (the gap (ADDR - .) & 0x1FFF, tools/layout/groups_ld.sh), so a size change before it needs no
# re-pin.  Recorded from the 3790851f-identical ELFs of all six profiles
# (runs/c31-40311176): each pad's end, so every EBOOT stayed identical.  A
# region that grows past its pin would wrap and spend a PSP-1000 heap page:
# a strict build (the release always) fails the link instead, and only
# `layout_lock.py regen --spend-page/--free-page/--move` changes a pin.  The
# four rig profiles get sections of their own (pins only): they used the
# release pad numbers, which put their regions at other offsets.
# Code-health C3-4: the RO pad is `pin ro`, .rodata after the start files
# (crt0.o's .rodata.str1.4 holds every object's merged strings), recorded as
# the pad's end from the 772c0d43 maps (e0039a74-identical).  The merged
# table is before the pin, so a few bytes more or less of strings (the 4 B
# version-string trap of tools/layout/ro_margin.py, now deleted) move nothing.
# Code-health C-1 commit 4 (the frame loop leaves main; the one placement
# decision of tier C): the loop is frame_loop, the only .text.startup input,
# and `pin main` is `pin frame_loop`.  Placed by the by-line scan against the
