# and power_cb) and pte_mutex_check_need_init (-16 B release, +8 B lab).
# HW-1 review r2 follow-ups (H6, H3, H4, H2, H1's wake notice): +528 B release,
# +516 B lab between exit_cb and pace_frame, and new strings.  release: TEXT
# 856 -> 328, CORE 876 -> 892, RO 576 -> 512; lab: TEXT 7784 -> 7268, FE
# 2528 -> 2408, RO 128 -> 8064 (wrapped); main, pace_frame and the rest hold.
# Re-recorded: exit_cb (release 0x0058 -> 0x1e48, lab 0x0bf8 -> 0x09f4) and the
# release's pte_mutex_check_need_init (+16 B).
# HW-1 H1, the ME-lost notice with no power hold: wake_me_lost_notice is 124 B
# smaller in the release, 76 B in the lab.  release: TEXT 328 -> 452; lab:
# TEXT 7268 -> 7344; every other pad, main, pace_frame and the rest hold.
# Re-recorded: exit_cb (release 0x1e48 -> 0x1ec4, lab 0x09f4 -> 0x0a40).
# HW-2 (claude/hw2-exit): main's code before the loop grew, so MAIN places the
# loop again (release 2284 -> 2120, lab 176 -> 368: main 0x1368 / 0x0c90)
# and TEXT/FE/CORE/RO hold pace_frame, fe_host_reset, pipe_latch and
# netpacket_iface; re-recorded: main (at, size), exit_cb, roster_valid
# (transport_adhoc.c's switch wait grew the code before it) and
