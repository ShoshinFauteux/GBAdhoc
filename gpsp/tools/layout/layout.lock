# tools/layout/layout.lock -- where the pinned layout puts the symbols that
# carry it (tools/layout/layout_lock.py; docs/LAYOUT-PINNING.md "Keeping the
# pads").  tools/build.sh checks a release and a default lab build against
# their section and fails on any difference.  Values are re-recorded with
# `layout_lock.py write FLAVOUR NM` after a re-pin that was checked, never to
# make a build pass.
#
# [release]: tools/build.sh release (adapter ticks, as every build since C-4), recorded from the round-7
#            release ELF 2f3e3aae (9e41b91e).
# [lab]:     tools/build.sh lab, recorded from the round-7 lab
#            arm C ELF 0f31d0a6 (9e41b91e) (then with the lab's own pad
#            numbers; since code-health C3-3 its pins below carry them).
# The B-region, hash-table and JIT-base lines were added in round 9 and
# measured on the round-8 ELFs fb410a57 / 51d607c5 (nm identical to round 7).
#
# beta.5 base (claude/beta5-base: beta.4.1 + claude/opt-1000 7a39eb40): both
# sections re-recorded after the re-pin that puts the frame loop's window,
# B's hot text, main_psp.o's per-frame code (pace_frame, net_frame ..),
# fe_host's run (fe_host_reset ..) and A's cold text back on the round-8
# ELFs' sets (r8.elf fb410a57, r8lab.elf 51d607c5).  `main` itself moves:
# its code before the loop grew 212 B, so LAYOUT_PAD_MAIN_BYTES (new,
# psp/layout_pad_main.S) places the loop, not main's first byte.  The pad
# anchors now name what each pad is tuned for.
# Round 9 merged (claude/opt-1000 a27c15fe): netdrv's ARQ receive path
# shrank 96 B (FE pad +96 holds fe_host_reset; roster_valid .. peer_remove
# move +96) and both GB cores 696 B (LAYOUT_PAD_GB_BYTES, after both GB
# cores, holds hex_val: fe_cheats onward unmoved vs 7ffe4236).
# beta.5 JIT fix (claude/jit-thrash-fix merged into claude/beta5-base): the
# lookups' and smc_retire_span's growth is given back in the hot order (the
# bscan rows) and the BSCAN pad takes it, so both sections hold as recorded
# for 9c1b279f (37 entries, 0 differ; nothing re-recorded).
# smc-cost (claude/smc-cost): five pinned functions shrank; the hot order
# gives the bytes back right after each (moved-out helpers and smc_fill_*
# zeros), two helpers join the bscan rows (BSCAN release 664, lab 888).  One
# value re-recorded in each section: tail gbab_block_lookup_translate_thumb
# 32 -> 40.  B's thumb lookup is 1720 B now (was 1792) and gbalink_b_stubs.c
# still appends its 32 B of zeros; the next 32 B boundary is 8 B further,
# where B's smc_fill_lkt starts.  Everything after it is where a34f8eaf had it.
# The beta.5 re-pin (claude/beta5-rc: ff-15x, spd-combo, smc-cost,
# link-desync and Epoch C merged on 94d348a2; docs/LAYOUT-PINNING.md):
# `at main` is the best by-line shift of the merged loop against
# 957a5c4fbb1b (release 0x1cd4, lab 0x1580); pace_frame, fe_host_reset,
# hex_val, the hot core, warm tail, B's region, .data, reg, _gp and the JIT
# bases hold their values.  Re-recorded: main's size, exit_cb, pte_mutex,
# me_replay_lines, netpacket_iface (+16 both: .rodata's 64 B steps) and
# the release's _ZL10pipe_latchv#1 0x1ee0 (768 B under its 0x01e0: the
# CORE/RO trade that keeps both pads from wrapping, one heap page).
# 5.0.0 integration (PCARG_SIDE + its review hardening merged): [release]
# holds as recorded (PCARG's three pads; the hardening's +480 B per instance
# comes out of .text.pcarg_layout_pad).  [lab]: instance A's cold core text is
