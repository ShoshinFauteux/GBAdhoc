# (.rodata moves in 64 B steps here: the nearer of -8 / +56).  The release RO
# pad is 236 so that its end sits 32 B above that step: the merged string
# table before it is 4 B shorter for a commit whose short hash ends like one
# of its entries, and at 208 (4 B above) such a build failed this entry
# (tools/layout/ro_margin.py; docs/LAYOUT-PINNING.md, "Keeping the pads").
# The 5.0.0 integration re-pin (HW-1, HW-2, the screenshots and the slot
# browser merged on the beta line; the entries above are each branch's own):
# main's blocks differ from every branch's, so MAIN puts main at the best
# by-line shift against 957a5c4fbb1b (release 0x1420, 32.4 %; lab 0x0ae0,
# 22.3 %); TEXT/FE/GB/CORE/RO hold pace_frame, fe_host_reset, hex_val,
