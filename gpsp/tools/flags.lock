# tools/flags.lock -- the build flags as committed.  tools/check_flags.py fails when
# the tree differs; change it with --update, in the commit that means it.
build.sh CHEATS=1
build.sh GBA_LINK=1
build.sh INPUT_FRESH=1
build.sh LAYOUT_PIN=1
build.sh REWIND=1
core BACKUP_BUS_FIX=1
core BADJUMP_SAFE=1
core BX_ALIGN_FIX=1
core COND_ENTRY_FIX=1
core DISPATCH_CACHE=1
core DISPATCH_CYCLE_CHECK=1
core DISPATCH_PRECISE=1
core DMA_ADAPT_V2=1
core DMA_SMC_ADAPT=1
core DMA_SMC_FLUSH=1
core DMA_SMC_RETIRE=1
core ENTRY_GATES=1
core ENTRY_GATES_FAST=1
core ENTRY_GATES_RANGE=1
core FIQ_BANK_FIX=1
core GBA_PC_MASK=1
core HOT_DATA_GUARD=1
core HOT_DATA_OFFSET=0x1b00
core IRQ_IO_FAST=1
core JIT_CODE_DISCIPLINE=1
core JIT_COST=1
core MSR_FAST=1
core SCHED_FAST=1
core SERIAL_IDLE_FAST=1
core SMC_GATES=1
core SMC_GATES_RANKED=1
core SMC_GATES_SIMPLE=1
core SMC_GATE_BITMAP=1
core SMC_GATE_CHARGE=1
core SMC_GATE_SELFPATCH=1
core SMC_IMM_PATCH=1
core SMC_PARTIAL_DIRECT_LINKS=1
core SMC_PARTIAL_SAFE=1
core SMC_PARTIAL_SINGLE=1
core SMC_PARTIAL_STABLE_THUNK=1
core SMC_RETIRE_LIST=1
core SMC_RETIRE_LOCAL=1
core SMC_RETIRE_WINDOW=1
core SMC_REUSE=1
core SMC_REUSE_MODE=3
core SMC_REUSE_SPARE_KB=256
core SMC_SAME_ADAPT=1
core SMC_SAME_REPROBE=1024
core SMC_SAME_SKIP=1
core SMC_SINGLE_ANYPC=1
core SMC_SINGLE_EWRAM=1
core SMC_SINGLE_HALF=1
core SMC_SINGLE_HOT=64
core SMC_SINGLE_THUMB=1
core SMC_SINGLE_UNTAG=1
core SMC_STM_AHEAD=1
core SMC_STM_CHAIN=1
core SMC_STM_RANGE=1
core SMC_STM_WIDE=1
core SPIN_SKIP=1
core TIMER_RELOAD_FIX=1
core VRAM_EXEC=1
core XLAT_FAST=1
core XLAT_PURE=1
core XS_HEAP=1
core XS_NOTE_FAST=1
core XS_WALK_PAIR=1
frontend ND_MAX_PAYLOAD=144
frontend ND_RTO_MAX_US=2500000
frontend ND_RTO_MIN_US=200000
frontend ND_TXQ_CAP=384
frontend ND_WINDOW=256
frontend PLAY_INPUT_FRESH=1
frontend VID_TRIPLE=1
make:Makefile CHEATS=1
make:Makefile GBA_LINK=1
make:Makefile LAYOUT_PIN=1
make:Makefile PSP_PIXFMT=psp5650
make:Makefile REWIND=1
make:psp/Makefile CHEATS=1
make:psp/Makefile GBA_LINK=1
make:psp/Makefile HOT_DATA_GUARD=1
make:psp/Makefile LAYOUT_PAD_BYTES=528
make:psp/Makefile LAYOUT_PIN=1
make:psp/Makefile PSP_LARGE_MEMORY=1
make:psp/Makefile PSP_PIXFMT=psp5650
make:psp/Makefile REWIND=1
make:psp/Makefile TGB_LAZY_TIMER=1
profile:diagnostic CORE_FLAGS=GPSP_PROFILE=diagnostic BADJUMP_REPORT=1 XLAT_DEPTH_PROBE=1 IRQ_INTEGRITY_CHECK=1
profile:diagnostic FE_DEFS=-DGPSP_PLAYABLE -DGPSP_PROFILE_DIAGNOSTIC=1
profile:diagnostic TITLE=GBAdhoc DIAG
profile:harness CORE_FLAGS=GPSP_PROFILE=harness
profile:harness FE_DEFS=-DGPSP_PLAYABLE -DGPSP_KEEP_TELEMETRY -DGPSP_PERF_RIG -DGPSP_PROFILE_HARNESS=1
profile:harness PSP_MAKE_FLAGS=PSP_LARGE_MEMORY=0
profile:harness TITLE=GBAdhoc HARNESS
profile:harness64 CORE_FLAGS=GPSP_PROFILE=harness
profile:harness64 FE_DEFS=-DGPSP_PLAYABLE -DGPSP_KEEP_TELEMETRY -DGPSP_PERF_RIG -DGPSP_PROFILE_HARNESS=1
profile:harness64 PSP_MAKE_FLAGS=PSP_LARGE_MEMORY=1 ME_CATCH=1
profile:harness64 TITLE=GBAdhoc HARNESS64
profile:lab CORE_FLAGS=GPSP_PROFILE=harness
profile:lab FE_DEFS=-DGPSP_PLAYABLE -DGPSP_KEEP_TELEMETRY -DGPSP_PERF_RIG -DGPSP_PROFILE_HARNESS=1
profile:lab PSP_MAKE_FLAGS=PSP_LARGE_MEMORY=0 LAB_HARNESS=1
profile:lab TITLE=GBAdhoc LAB
profile:release CORE_FLAGS=GPSP_PROFILE=release
profile:release FE_DEFS=-DGPSP_PLAYABLE -DGPSP_PROFILE_RELEASE=1
profile:release PSP_MAKE_FLAGS=ME_CATCH=1 PSP_EBOOT_ICON1=assets/gbadhoc_icon1.pmf
profile:release TITLE=GBAdhoc
profile:soak CORE_FLAGS=GPSP_PROFILE=soak BADJUMP_REPORT=1 XLAT_DEPTH_PROBE=1 IRQ_INTEGRITY_CHECK=1
profile:soak FE_DEFS=-DGPSP_PLAYABLE -DGPSP_KEEP_TELEMETRY -DGPSP_PERF_RIG -DGPSP_PROFILE_HARNESS=1
profile:soak PSP_MAKE_FLAGS=PSP_LARGE_MEMORY=0
profile:soak TITLE=GBAdhoc SOAK
