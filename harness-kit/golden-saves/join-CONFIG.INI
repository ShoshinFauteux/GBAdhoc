scale = 0
filter = 0
ff_mult_x10 = 20
ff_hold = 1
net_skip_threshold = 25
group = GPSP07
nick = PSPAGB
core_phase = 2
net_tx_thread = 1
log_thread = 1
sram_thread = 1
net_pace_match = 1
blit_mode = 2
gu_defer = 1

# Back to the usable rate. 19.98 was a diagnostic, not a destination -- and
# it answered its question: the client misses the clamp even with 3x headroom,
# so this is not a speed problem.
net_session_fps = 40.00
net_session_fps_snap = 0

# Keeper. You see every frame the emulator produces.
net_frameskip = 0

# ADR-0042 was falsified for THROUGHPUT in the pre-vblank-fix regime.
# Re-armed for a different reason: the client's game receives up to 9 RFU
# messages in one frame (rxburst=9 vs the host's 2), which can collapse the
# Union Room exit handshake and the host's DISCONNECT into a single frame.
# 2 matches the host's natural rate; average demand is ~34/s, so 2/frame at
# 40 fps = 80/s leaves ample headroom.
rfu_rx_cap = 2
last_rom = EMERALD.GBA
