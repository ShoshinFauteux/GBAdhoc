<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- ============ background ============ -->
  <rect x="0" y="0" width="960" height="800" fill="#10141c"/>

  <!-- ============ title ============ -->
  <text x="480" y="46" text-anchor="middle" fill="#ece7da" font-size="27" font-weight="700" letter-spacing="2">THE DUAL-CORE RENDERER</text>
  <text x="480" y="72" text-anchor="middle" fill="#8b95a7" font-size="15">How GBAdhoc splits a Game Boy Advance frame across both PSP CPUs</text>

  <!-- ============ timeline ============ -->
  <!-- axis: two 16.7 ms frame periods, 120→480 and 480→840 -->
  <line x1="120" y1="100" x2="120" y2="330" stroke="#3a4557" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="480" y1="100" x2="480" y2="330" stroke="#3a4557" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="840" y1="100" x2="840" y2="330" stroke="#3a4557" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="120" y="96" text-anchor="middle" fill="#5b6577" font-size="11">vblank</text>
  <text x="480" y="96" text-anchor="middle" fill="#5b6577" font-size="11">vblank&#160;&#160;(16.7 ms)</text>
  <text x="840" y="96" text-anchor="middle" fill="#5b6577" font-size="11">vblank&#160;&#160;(33.4 ms)</text>

  <!-- lane bands -->
  <rect x="110" y="128" width="740" height="64" rx="6" fill="#141b26"/>
  <rect x="110" y="238" width="740" height="64" rx="6" fill="#141b26"/>
  <text x="100" y="155" text-anchor="end" fill="#ece7da" font-size="13" font-weight="700">MAIN CPU</text>
  <text x="100" y="171" text-anchor="end" fill="#5b6577" font-size="10">Allegrex 333 MHz</text>
  <text x="100" y="265" text-anchor="end" fill="#ece7da" font-size="13" font-weight="700">MEDIA ENGINE</text>
  <text x="100" y="281" text-anchor="end" fill="#5b6577" font-size="10">2nd core 333 MHz</text>

  <!-- MAIN CPU lane: frame N -->
  <rect x="122" y="134" width="304" height="52" rx="5" fill="#19b3a6" fill-opacity="0.22" stroke="#2fbfae" stroke-width="1.4"/>
  <text x="274" y="156" text-anchor="middle" fill="#7fe0d5" font-size="13" font-weight="700">EMULATE FRAME N</text>
  <text x="274" y="174" text-anchor="middle" fill="#8b95a7" font-size="10.5">dynarec · audio · wireless — render SKIPPED (capture only)</text>
  <!-- handoff -->
  <rect x="428" y="134" width="50" height="52" rx="5" fill="#2fbfae" fill-opacity="0.55" stroke="#2fbfae" stroke-width="1.4"/>
  <text x="453" y="157" text-anchor="middle" fill="#0e2b28" font-size="10.5" font-weight="700">HAND</text>
  <text x="453" y="170" text-anchor="middle" fill="#0e2b28" font-size="10.5" font-weight="700">OFF</text>
  <!-- MAIN CPU lane: frame N+1 -->
  <rect x="482" y="134" width="304" height="52" rx="5" fill="#19b3a6" fill-opacity="0.22" stroke="#2fbfae" stroke-width="1.4"/>
  <text x="634" y="156" text-anchor="middle" fill="#7fe0d5" font-size="13" font-weight="700">EMULATE FRAME N+1</text>
  <text x="634" y="174" text-anchor="middle" fill="#8b95a7" font-size="10.5">…while frame N renders on the other core</text>
  <rect x="788" y="134" width="50" height="52" rx="5" fill="#2fbfae" fill-opacity="0.55" stroke="#2fbfae" stroke-width="1.4"/>
  <text x="813" y="157" text-anchor="middle" fill="#0e2b28" font-size="10.5" font-weight="700">HAND</text>
  <text x="813" y="170" text-anchor="middle" fill="#0e2b28" font-size="10.5" font-weight="700">OFF</text>

  <!-- ME lane: renders previous frame during frame N, then frame N during N+1 -->
  <rect x="122" y="244" width="230" height="52" rx="5" fill="#e8a33d" fill-opacity="0.20" stroke="#e8a33d" stroke-width="1.4"/>
  <text x="237" y="266" text-anchor="middle" fill="#f2c988" font-size="13" font-weight="700">RENDER FRAME N&#8722;1</text>
  <text x="237" y="284" text-anchor="middle" fill="#8b95a7" font-size="10.5">160 scanlines · ~10 ms</text>
  <rect x="482" y="244" width="34" height="52" rx="5" fill="#e8a33d" fill-opacity="0.5" stroke="#e8a33d" stroke-width="1.4"/>
  <text x="499" y="262" text-anchor="middle" fill="#2b1f0a" font-size="9" font-weight="700">SNAP</text>
  <text x="499" y="273" text-anchor="middle" fill="#2b1f0a" font-size="9" font-weight="700">SHOT</text>
  <text x="499" y="286" text-anchor="middle" fill="#2b1f0a" font-size="8.5">1.4ms</text>
  <rect x="520" y="244" width="230" height="52" rx="5" fill="#e8a33d" fill-opacity="0.20" stroke="#e8a33d" stroke-width="1.4"/>
  <text x="635" y="266" text-anchor="middle" fill="#f2c988" font-size="13" font-weight="700">RENDER FRAME N</text>
  <text x="635" y="284" text-anchor="middle" fill="#8b95a7" font-size="10.5">160 scanlines · ~10 ms</text>

  <!-- handoff arrow -->
  <path d="M 453 190 L 453 226 L 496 226 L 496 238" fill="none" stroke="#2fbfae" stroke-width="1.6" stroke-dasharray="3 3"/>
  <path d="M 492 232 L 496 240 L 500 232" fill="none" stroke="#2fbfae" stroke-width="1.6"/>

  <!-- present markers -->
  <path d="M 352 296 L 352 318 L 470 318" fill="none" stroke="#8b95a7" stroke-width="1.4"/>
  <path d="M 464 314 L 472 318 L 464 322" fill="none" stroke="#8b95a7" stroke-width="1.4"/>
  <text x="360" y="332" fill="#8b95a7" font-size="10.5">frame N&#8722;1 &#8594; GE &#8594; screen (one frame of display latency)</text>

  <!-- ============ the four steps ============ -->
  <g>
    <rect x="60" y="368" width="204" height="150" rx="8" fill="#1a2230"/>
    <rect x="60" y="368" width="204" height="4" rx="2" fill="#2fbfae"/>
    <circle cx="84" cy="398" r="13" fill="#2fbfae"/>
    <text x="84" y="403" text-anchor="middle" fill="#0e2b28" font-size="14" font-weight="700">1</text>
    <text x="104" y="403" fill="#ece7da" font-size="14" font-weight="700">CAPTURE</text>
    <text x="76" y="428" fill="#a9b2c2" font-size="11.5">
      <tspan x="76" dy="0">While emulating, the core logs</tspan>
      <tspan x="76" dy="15">each scanline's LCD registers</tspan>
      <tspan x="76" dy="15">(20 KB/frame) instead of</tspan>
      <tspan x="76" dy="15">drawing. The ~6 ms software</tspan>
      <tspan x="76" dy="15">render never touches the</tspan>
      <tspan x="76" dy="15">main CPU.</tspan>
    </text>
  </g>
  <g>
    <rect x="272" y="368" width="204" height="150" rx="8" fill="#1a2230"/>
    <rect x="272" y="368" width="204" height="4" rx="2" fill="#e8a33d"/>
    <circle cx="296" cy="398" r="13" fill="#e8a33d"/>
    <text x="296" y="403" text-anchor="middle" fill="#2b1f0a" font-size="14" font-weight="700">2</text>
    <text x="316" y="403" fill="#ece7da" font-size="14" font-weight="700">HANDOFF</text>
    <text x="288" y="428" fill="#a9b2c2" font-size="11.5">
      <tspan x="288" dy="0">At frame end the Media Engine</tspan>
      <tspan x="288" dy="15">snapshots VRAM, OAM and the</tspan>
      <tspan x="288" dy="15">palette directly from the core</tspan>
      <tspan x="288" dy="15">(~1.4 ms), then signals — and</tspan>
      <tspan x="288" dy="15">emulation resumes</tspan>
      <tspan x="288" dy="15">immediately.</tspan>
    </text>
  </g>
  <g>
    <rect x="484" y="368" width="204" height="150" rx="8" fill="#1a2230"/>
    <rect x="484" y="368" width="204" height="4" rx="2" fill="#2fbfae"/>
    <circle cx="508" cy="398" r="13" fill="#2fbfae"/>
    <text x="508" y="403" text-anchor="middle" fill="#0e2b28" font-size="14" font-weight="700">3</text>
    <text x="528" y="403" fill="#ece7da" font-size="14" font-weight="700">PARALLEL RENDER</text>
    <text x="500" y="428" fill="#a9b2c2" font-size="11.5">
      <tspan x="500" dy="0">The ME replays all 160</tspan>
      <tspan x="500" dy="15">scanlines through the same</tspan>
      <tspan x="500" dy="15">renderer code (~10 ms) while</tspan>
      <tspan x="500" dy="15">the main CPU is already</tspan>
      <tspan x="500" dy="15">emulating the next frame.</tspan>
    </text>
  </g>
  <g>
    <rect x="696" y="368" width="204" height="150" rx="8" fill="#1a2230"/>
    <rect x="696" y="368" width="204" height="4" rx="2" fill="#e8a33d"/>
    <circle cx="720" cy="398" r="13" fill="#e8a33d"/>
    <text x="720" y="403" text-anchor="middle" fill="#2b1f0a" font-size="14" font-weight="700">4</text>
    <text x="740" y="403" fill="#ece7da" font-size="14" font-weight="700">PRESENT</text>
    <text x="712" y="428" fill="#a9b2c2" font-size="11.5">
      <tspan x="712" dy="0">The finished frame reaches the</tspan>
      <tspan x="712" dy="15">screen one frame later, via the</tspan>
      <tspan x="712" dy="15">GE. Output is bit-identical to</tspan>
      <tspan x="712" dy="15">the single-core renderer —</tspan>
      <tspan x="712" dy="15">verified frame by frame.</tspan>
    </text>
  </g>

  <!-- ============ frametime comparison ============ -->
  <text x="60" y="568" fill="#ece7da" font-size="15" font-weight="700" letter-spacing="1">WHERE THE FRAME TIME GOES</text>
  <text x="60" y="586" fill="#5b6577" font-size="11">budget: 16.74 ms per frame (59.73 fps) — scale: 36 px/ms</text>

  <!-- budget line -->
  <line x1="802" y1="600" x2="802" y2="726" stroke="#d96a4a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="810" y="612" fill="#d96a4a" font-size="10.5">16.74 ms budget</text>

  <!-- single core bar -->
  <text x="192" y="628" text-anchor="end" fill="#ece7da" font-size="12" font-weight="700">SINGLE CORE</text>
  <rect x="200" y="614" width="385" height="24" rx="4" fill="#19b3a6" fill-opacity="0.35" stroke="#2fbfae"/>
  <text x="392" y="630" text-anchor="middle" fill="#bfeee8" font-size="11">emulate ~10.7 ms</text>
  <rect x="585" y="614" width="216" height="24" rx="4" fill="#d96a4a" fill-opacity="0.4" stroke="#d96a4a"/>
  <text x="693" y="630" text-anchor="middle" fill="#f0b8a5" font-size="11">render ~6.0 ms</text>
  <text x="200" y="656" fill="#8b95a7" font-size="10.5">= 16.7 ms: zero headroom — heavy scenes (trade animation, blended battle effects) blow the budget and dip toward 40 fps</text>

  <!-- dual core bar -->
  <text x="192" y="692" text-anchor="end" fill="#ece7da" font-size="12" font-weight="700">DUAL CORE</text>
  <rect x="200" y="678" width="385" height="24" rx="4" fill="#19b3a6" fill-opacity="0.35" stroke="#2fbfae"/>
  <text x="392" y="694" text-anchor="middle" fill="#bfeee8" font-size="11">emulate ~10.7 ms</text>
  <rect x="585" y="678" width="50" height="24" rx="4" fill="#2fbfae" fill-opacity="0.55" stroke="#2fbfae"/>
  <text x="610" y="694" text-anchor="middle" fill="#0e2b28" font-size="9.5" font-weight="700">1.4</text>
  <rect x="635" y="678" width="167" height="24" rx="4" fill="#58c470" fill-opacity="0.18" stroke="#58c470" stroke-dasharray="4 3"/>
  <text x="718" y="694" text-anchor="middle" fill="#8fdda4" font-size="11">~4.6 ms headroom</text>
  <text x="200" y="720" fill="#8b95a7" font-size="10.5">the 6 ms render moved to the Media Engine and runs in parallel — the main CPU keeps its headroom even in heavy scenes</text>

  <!-- footer -->
  <line x1="60" y1="748" x2="900" y2="748" stroke="#232c3b" stroke-width="1"/>
  <text x="480" y="774" text-anchor="middle" fill="#5b6577" font-size="11">If the Media Engine is unavailable, GBAdhoc transparently falls back to single-core rendering — nothing breaks, it is simply faster with both cores.</text>
</svg>
